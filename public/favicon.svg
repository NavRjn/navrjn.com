<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="scanlines" width="64" height="4" patternUnits="userSpaceOnUse">
      <rect width="64" height="2" fill="#000000" opacity=".22"/>
      <rect y="2" width="64" height="2" fill="#123012" opacity=".12"/>
    </pattern>
  </defs>

  <!-- CRT screen -->
  <rect width="64" height="64" rx="12" fill="#030803"/>

  <!-- subtle green phosphor glow -->
  <path
    d="
      M16 16 H24
      V20 H28
      V24 H32
      V28 H36
      V32 H40
      V16 H48
      V48 H40
      V44 H36
      V40 H32
      V36 H28
      V32 H24
      V48 H16 Z
    "
    fill="#39ff14"
    opacity=".25"
    filter="url(#glow)"
  />

  <!-- terminal N -->
  <path
    d="
      M16 16 H24
      V20 H28
      V24 H32
      V28 H36
      V32 H40
      V16 H48
      V48 H40
      V44 H36
      V40 H32
      V36 H28
      V32 H24
      V48 H16 Z
    "
    fill="#39ff14"
    filter="url(#glow)"
  />

  <!-- CRT scanlines -->
  <rect width="64" height="64" rx="12" fill="url(#scanlines)"/>
</svg>
