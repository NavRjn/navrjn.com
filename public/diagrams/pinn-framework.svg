<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="Inter,system-ui,sans-serif" role="img" aria-label="PINN framework architecture"><style>@keyframes d{to{stroke-dashoffset:-14}}line[marker-end],path[marker-end]{stroke-dasharray:5 4;animation:d 1.2s linear infinite}@media(prefers-reduced-motion:reduce){line[marker-end],path[marker-end]{animation:none}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8c8c92"/></marker></defs><rect width="100%" height="100%" fill="#101012"/><text x="20" y="26" font-size="11" font-weight="600" letter-spacing="1.4" fill="#b4c9a9">PINN FRAMEWORK</text><rect x="20" y="60" width="200" height="56" rx="4" fill="#171c15" stroke="#b4c9a9"/><text x="120" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="#e7e7e7">pinn CLI</text><text x="120" y="100" text-anchor="middle" font-size="10.5" fill="#9a9aa0">Typer: train · viz · add</text><rect x="300" y="60" width="200" height="56" rx="4" fill="#161618" stroke="#3a3a40"/><text x="400" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="#e7e7e7">core engine</text><text x="400" y="100" text-anchor="middle" font-size="10.5" fill="#9a9aa0">training + visualization</text><rect x="580" y="60" width="200" height="56" rx="4" fill="#161618" stroke="#3a3a40"/><text x="680" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="#e7e7e7">outputs/</text><text x="680" y="100" text-anchor="middle" font-size="10.5" fill="#9a9aa0">runs + checkpoints</text><line x1="220" y1="88" x2="300" y2="88" stroke="#8c8c92" stroke-width="1.3" marker-end="url(#a)"/><line x1="500" y1="88" x2="580" y2="88" stroke="#8c8c92" stroke-width="1.3" marker-end="url(#a)"/><rect x="20" y="180" width="200" height="56" rx="4" fill="#161618" stroke="#3a3a40"/><text x="120" y="204" text-anchor="middle" font-size="13" font-weight="600" fill="#e7e7e7">configs/*.yaml</text><text x="120" y="220" text-anchor="middle" font-size="10.5" fill="#9a9aa0">one file = one experiment</text><rect x="300" y="180" width="200" height="56" rx="4" fill="#161618" stroke="#3a3a40"/><text x="400" y="204" text-anchor="middle" font-size="13" font-weight="600" fill="#e7e7e7">problem plugins</text><text x="400" y="220" text-anchor="middle" font-size="10.5" fill="#9a9aa0">discovered at runtime</text><rect x="580" y="180" width="200" height="56" rx="4" fill="#161618" stroke="#3a3a40"/><text x="680" y="204" text-anchor="middle" font-size="13" font-weight="600" fill="#e7e7e7">templates/</text><text x="680" y="220" text-anchor="middle" font-size="10.5" fill="#9a9aa0">scaffold via pinn add</text><line x1="120" y1="180" x2="350" y2="116" stroke="#8c8c92" stroke-width="1.3" marker-end="url(#a)"/><line x1="400" y1="180" x2="400" y2="116" stroke="#8c8c92" stroke-width="1.3" marker-end="url(#a)"/><line x1="580" y1="208" x2="500" y2="208" stroke="#8c8c92" stroke-width="1.3" marker-end="url(#a)"/><text x="400" y="272" text-anchor="middle" font-size="11" fill="#c4c4c9">Each problem exposes an API class: Bratu 1D · Gray-Scott 2D reaction-diffusion · your PDE</text><text x="400" y="296" text-anchor="middle" font-size="11" fill="#77777e">Framework is stable. Problems are plugins. Everything reproducible from YAML.</text></svg>