<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Inter,system-ui,sans-serif" role="img" aria-label="Hierarchical coroutine orchestration for the drone app"><style>@keyframes d{to{stroke-dashoffset:-14}}line[marker-end],path[marker-end]{stroke-dasharray:5 4;animation:d 1.2s linear infinite}@media(prefers-reduced-motion:reduce){line[marker-end],path[marker-end]{animation:none}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8c8c92"/></marker></defs><rect width="100%" height="100%" fill="#101012"/><text x="20" y="26" font-size="11" font-weight="600" letter-spacing="1.4" fill="#b4c9a9">COROUTINE ORCHESTRATION (ANDROID, 20 Hz)</text><rect x="290" y="48" width="220" height="50" rx="4" fill="#171c15" stroke="#b4c9a9"/><text x="400" y="69" text-anchor="middle" font-size="13" font-weight="600" fill="#e7e7e7">Flight supervisor</text><text x="400" y="85" text-anchor="middle" font-size="10.5" fill="#9a9aa0">hierarchical scope, owns lifecycle</text><rect x="20" y="160" width="170" height="56" rx="4" fill="#161618" stroke="#3a3a40"/><text x="105" y="184" text-anchor="middle" font-size="13" font-weight="600" fill="#e7e7e7">Perception</text><text x="105" y="200" text-anchor="middle" font-size="10.5" fill="#9a9aa0">camera → CV + depth</text><line x1="400" y1="98" x2="105" y2="160" stroke="#8c8c92" stroke-width="1.3" marker-end="url(#a)"/><rect x="210" y="160" width="170" height="56" rx="4" fill="#161618" stroke="#3a3a40"/><text x="295" y="184" text-anchor="middle" font-size="13" font-weight="600" fill="#e7e7e7">Telemetry</text><text x="295" y="200" text-anchor="middle" font-size="10.5" fill="#9a9aa0">DJI SDK, IMU, state</text><line x1="400" y1="98" x2="295" y2="160" stroke="#8c8c92" stroke-width="1.3" marker-end="url(#a)"/><rect x="400" y="160" width="170" height="56" rx="4" fill="#161618" stroke="#3a3a40"/><text x="485" y="184" text-anchor="middle" font-size="13" font-weight="600" fill="#e7e7e7">Control</text><text x="485" y="200" text-anchor="middle" font-size="10.5" fill="#9a9aa0">20 Hz command loop</text><line x1="400" y1="98" x2="485" y2="160" stroke="#8c8c92" stroke-width="1.3" marker-end="url(#a)"/><rect x="590" y="160" width="170" height="56" rx="4" fill="#161618" stroke="#3a3a40"/><text x="675" y="184" text-anchor="middle" font-size="13" font-weight="600" fill="#e7e7e7">Recovery</text><text x="675" y="200" text-anchor="middle" font-size="10.5" fill="#9a9aa0">drift / occlusion policies</text><line x1="400" y1="98" x2="675" y2="160" stroke="#8c8c92" stroke-width="1.3" marker-end="url(#a)"/><rect x="20" y="280" width="360" height="50" rx="4" fill="#161618" stroke="#3a3a40"/><text x="200" y="301" text-anchor="middle" font-size="13" font-weight="600" fill="#e7e7e7">Shared state &amp; clock</text><text x="200" y="317" text-anchor="middle" font-size="10.5" fill="#9a9aa0">single-writer snapshots, deterministic sync</text><rect x="420" y="280" width="360" height="50" rx="4" fill="#161618" stroke="#3a3a40"/><text x="600" y="301" text-anchor="middle" font-size="13" font-weight="600" fill="#e7e7e7">Observability</text><text x="600" y="317" text-anchor="middle" font-size="10.5" fill="#9a9aa0">Prometheus metrics · Loki logs · Grafana</text><line x1="105" y1="216" x2="105" y2="280" stroke="#3a3a40" stroke-dasharray="3 3"/><line x1="295" y1="216" x2="295" y2="280" stroke="#3a3a40" stroke-dasharray="3 3"/><line x1="485" y1="216" x2="560" y2="280" stroke="#3a3a40" stroke-dasharray="3 3"/><line x1="675" y1="216" x2="640" y2="280" stroke="#3a3a40" stroke-dasharray="3 3"/><text x="400" y="360" text-anchor="middle" font-size="11" fill="#77777e">Cancelling the supervisor cancels every child: no leaked coroutines, no zombie states.</text></svg>